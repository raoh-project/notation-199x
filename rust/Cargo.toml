[package]
name = "notation199x"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "The rules for reading text that Raoh and Souther share: Unicode 18.0.0 case conversion and normalization, White_Space, order and length in scalar values, temporal text, and the pattern language"
license = "Apache-2.0"
repository = "https://github.com/raoh-project/notation-199x"
keywords = ["unicode", "normalization", "case", "pattern", "no_std"]
categories = ["text-processing", "no-std"]

# What a release of the crate implements, which its version does not say. The release workflow
# writes it into the notes of the GitHub release, and crates.io holds it with the version. P1 and P2
# are the image formats in image/; the crate reads an image with Pattern::from_image and writes none.
[package.metadata.notation199x]
unicode = "18.0.0"
images-read = ["P1", "P2"]
images-written = []

[dependencies]

[dev-dependencies]
regex = "1"
